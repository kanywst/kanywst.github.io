<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e0e" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>kanywst</title>
    <meta
      name="description"
      content="kanywst: Identity, Authorization, and Cloud Native Security."
    />

    <meta property="og:title" content="kanywst" />
    <meta
      property="og:description"
      content="Identity, Authorization, and Cloud Native Security."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kanywst.github.io/" />
    <!-- Built from the site's own font and palette by scripts/make-og.mjs, with the counts
         read out of profile.json. Committed rather than generated at build time — re-run the
         script after a sync that moves the headline numbers. -->
    <meta property="og:image" content="https://kanywst.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="kanywst — Identity, Authorization, and Cloud Native Security."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="kanywst" />
    <meta
      name="twitter:description"
      content="Identity, Authorization, and Cloud Native Security."
    />
    <meta name="twitter:image" content="https://kanywst.github.io/og.png" />

    <!-- Self-hosted so the OpenType features actually work: the Google Fonts build of Geist
         Mono ships without them (ss01/ss02/ss11 and the box-drawing glyphs are all missing
         there). One variable file covers weights 100-900, same origin, no third-party
         handshake. SIL OFL 1.1 — see /fonts/GeistMono-LICENSE.txt. -->
    <link
      rel="preload"
      href="/fonts/GeistMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
