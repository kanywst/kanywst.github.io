name: Sync profile data

# Refresh src/data/profile.json from the GitHub API on a schedule, then (only if it
# changed) commit and redeploy the page. Self-contained: a GITHUB_TOKEN push does NOT
# trigger the on:push deploy workflow, so this job builds + deploys Pages itself.

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      redraw_og:
        description: 'Redraw the OG card even when the data has not changed'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Refresh profile.json
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync-profile.mjs
          node scripts/sync-advisories.mjs
          if git diff --quiet -- src/data/profile.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The OG card bakes the headline counts into a PNG, so a sync that moves them leaves
      # the social preview asserting a stale number about a real record. Regenerating it
      # here is what keeps the card honest — a comment telling a human to remember is not a
      # mechanism. Only runs when the data actually moved, so the chromium download is not
      # a daily cost.
      - name: Redraw the OG card
        # The cron only reaches this on a day the counts actually moved, which makes it the
        # one path here that can sit unexercised for weeks and then fail when it finally
        # matters. The dispatch input runs it on demand so it can be proven on an ordinary
        # day; with unchanged data it redraws an identical PNG and the commit finds nothing.
        if: steps.sync.outputs.changed == 'true' || inputs.redraw_og
        # Best-effort on purpose. Without this, a flaky chromium download would abort the
        # job and the correct, already-fetched profile.json would never be committed or
        # deployed — withholding real data because a cosmetic asset failed to redraw. The
        # card going one day stale is the cheaper failure, and it shows up as a red step.
        continue-on-error: true
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/make-og.mjs

      - name: Commit refreshed data
        if: steps.sync.outputs.changed == 'true' || inputs.redraw_og
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # a forced redraw of unchanged data produces an identical PNG, so there is
          # genuinely nothing to commit and that is a success, not a failure
          if git diff --quiet; then
            echo 'nothing changed'
            exit 0
          fi
          git commit -am 'chore: sync profile.json [skip ci]'
          git push

      - name: Build
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm install
          npm run build

      - uses: actions/upload-pages-artifact@v5
        if: steps.sync.outputs.changed == 'true'
        with:
          path: dist

      - id: deployment
        if: steps.sync.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
