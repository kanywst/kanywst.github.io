name: Claude review

# CI answers "does it build and do the tests pass". This asks the question no
# script here can. It reviews, it does not gate: nothing here is a required
# check.
#
# The action refuses to run when this file differs from the copy on the default
# branch, so a pull request cannot rewrite its own reviewer. The cost is that
# any change to this file, including the one that added it, goes unreviewed by
# Claude until it is merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # A pull request from a fork gets no secrets, so the job would fail on
    # authentication rather than say anything useful. Drafts are skipped until
    # they are marked ready, which is what the ready_for_review trigger is for.
    #
    # Dependabot is skipped for the same reason a fork is: its runs read the
    # Dependabot secret store, not the Actions one, so the token is empty and
    # the guard below fails the check. Adding the secret there would not help,
    # since Dependabot's GITHUB_TOKEN is read-only and the review is posted as
    # a comment. A version bump is not what this reviewer is for anyway.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            This is a data-driven profile page. src/data/profile.json is the single source
            of truth and is regenerated by scripts/sync-profile.mjs from live GitHub data,
            while curation such as ordering, taglines and prose is preserved across syncs.

            Do not repeat what CI already does. Lint, types, the tests and the build run on
            this PR already.

            Look for what only a reader can catch:

            1. Curation lost in a sync. The script's job is to refresh live fields without
               flattening the hand-written ones. A change that overwrites, reorders or drops
               curated content will be noticed only after it ships.

            2. Hand edits to generated fields, which the next sync silently reverts. The fix
               belongs in the script.

            3. Claims about the person. Counts of merged pull requests, stars and releases
               are assertions about a real record, so they should be derived rather than
               typed, and a stale number here is worse than no number.

            4. Failure modes of the sync. A rate limit, a renamed repository or a deleted
               pull request should degrade rather than write an empty or truncated
               profile.json.

            5. Accessibility of the reveal interaction, including keyboard access and
               reduced motion, since the page hides content behind it by design.

            Post findings as inline comments on the lines they concern. Use one
            top-level comment for the summary. Be specific and cite
            `file:line`. If the diff is clean against all of the above, say so
            in one line rather than manufacturing nits.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
